<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DARK CHARM BOT</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: #08050d;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}

header {
  padding: 25px 10px;
  border-bottom: 1px solid #8700ff;
  color: #c084fc;
  font-size: 25px;
  font-weight: bold;
}

.hero {
  padding: 55px 20px;
}

.logo {
  font-size: 65px;
  color: #a020f0;
  text-shadow: 0 0 25px #9400ff;
}

h1 {
  font-size: 35px;
  margin: 15px 0;
}

p {
  color: #c4b5d5;
  line-height: 1.7;
}

.panel {
  max-width: 420px;
  margin: 30px auto;
  padding: 25px;
  background: #160d20;
  border: 1px solid #8700ff;
  border-radius: 18px;
  box-shadow: 0 0 20px #50008055;
}

input {
  width: 100%;
  padding: 14px;
  margin-top: 15px;
  border-radius: 10px;
  border: 1px solid #8700ff;
  background: #08050d;
  color: white;
  font-size: 16px;
}

input::placeholder {
  color: #a78bfa;
}

button {
  background: linear-gradient(90deg,#7200ff,#bd00ff);
  color: white;
  border: none;
  padding: 13px 20px;
  border-radius: 30px;
  font-size: 15px;
  font-weight: bold;
  margin: 10px 5px;
  cursor: pointer;
}

button:disabled {
  opacity: 0.6;
  cursor: wait;
}

#reply {
  margin-top: 20px;
  padding: 15px;
  background: #08050d;
  border: 1px solid #8700ff;
  border-radius: 10px;
  color: #c084fc;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

footer {
  padding: 25px;
  color: #a78bfa;
  border-top: 1px solid #8700ff;
}

@media (max-width: 480px) {
  h1 {
    font-size: 28px;
  }

  .panel {
    margin: 25px 5px;
  }
}
</style>
</head>

<body>

<header>👑 DARK CHARM</header>

<section class="hero">

<div class="logo">DC</div>

<h1>DARK CHARM BOT</h1>

<p>Welcome to Dark Charm WhatsApp Bot.</p>
<p>Connect • Command • Enjoy</p>

<div class="panel">

<h2>👑 COMMAND CENTER</h2>

<p>Choose or type your command.</p>

<input
  type="text"
  id="command"
  placeholder="Enter .ping, .menu or .help"
  autocomplete="off"
>

<button onclick="sendCommand('.ping')">PING</button>
<button onclick="sendCommand('.menu')">MENU</button>
<button onclick="sendCommand('.help')">HELP</button>

<br>

<button id="sendButton" onclick="sendCommand()">
SEND COMMAND
</button>

<div id="reply">Waiting for command...</div>

</div>

</section>

<footer>
© 2026 DARK CHARM BOT
<br><br>
Powered by DARK CHARM
</footer>

<script>
async function sendCommand(selectedCommand) {

  const input = document.getElementById("command");
  const reply = document.getElementById("reply");
  const button = document.getElementById("sendButton");

  const command = (
    selectedCommand || input.value
  ).trim().toLowerCase();

  const allowed = [".ping", ".menu", ".help"];

  if (!allowed.includes(command)) {
    reply.textContent = "❌ Unknown command. Use .menu";
    return;
  }

  input.value = command;
  button.disabled = true;
  reply.textContent = "Connecting to DARK CHARM server...";

  try {

    const response = await fetch(
      "https://dark-charm-bot-1.onrender.com/api/command",
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ command })
      }
    );

    const data = await response.json();

    if (!response.ok || !data.success) {
      throw new Error("Server error");
    }

    reply.textContent = data.reply;

  } catch (error) {

    reply.textContent = "❌ ERROR: " + error.message;
    console.error("DARK CHARM ERROR:", error);

  } finally {

    button.disabled = false;

  }
}
</script>

</body>
</html>
