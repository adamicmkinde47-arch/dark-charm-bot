
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DARK CHARM BOT</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: #08050d;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}

header {
  padding: 25px 10px;
  border-bottom: 1px solid #8700ff;
  color: #c084fc;
  font-size: 25px;
  font-weight: bold;
}

.hero {
  padding: 65px 20px;
}

.logo {
  font-size: 65px;
  color: #a020f0;
  text-shadow: 0 0 25px #9400ff;
}

h1 {
  font-size: 35px;
  margin: 15px 0;
}

p {
  color: #c4b5d5;
  line-height: 1.7;
}

.panel {
  max-width: 420px;
  margin: 30px auto;
  padding: 25px;
  background: #160d20;
  border: 1px solid #8700ff;
  border-radius: 18px;
  box-shadow: 0 0 20px #50008055;
}

input {
  width: 100%;
  padding: 14px;
  margin-top: 15px;
  border-radius: 10px;
  border: 1px solid #8700ff;
  background: #08050d;
  color: white;
  font-size: 16px;
}

input::placeholder {
  color: #a78bfa;
}

button {
  background: linear-gradient(90deg,#7200ff,#bd00ff);
  color: white;
  border: none;
  padding: 15px 25px;
  border-radius: 30px;
  font-size: 17px;
  font-weight: bold;
  margin-top: 20px;
  cursor: pointer;
}

button:disabled {
  opacity: 0.6;
}

footer {
  padding: 25px;
  color: #a78bfa;
  border-top: 1px solid #8700ff;
}
</style>
</head>

<body>

<header>
  👑 DARK CHARM
</header>

<section class="hero">

<div class="logo">DC</div>

<h1>DARK CHARM BOT</h1>

<p>Welcome to Dark Charm WhatsApp Bot.</p>
<p>Connect • Pair • Enjoy</p>

<div class="panel">
  <h2>Backend Connection Test</h2>

  <p>Enter a test number</p>

  <input
    type="tel"
    id="phone"
    placeholder="2557XXXXXXXX"
    maxlength="12"
    autocomplete="off"
  >

  <button id="startButton" onclick="startPairing()">
    TEST CONNECTION
  </button>

  <p id="message" style="margin-top:20px;font-size:12px">
    Ready to test backend connection.
  </p>

  <p style="margin-top:10px;font-size:12px">
    This is a connection test, not WhatsApp pairing.
  </p>
</div>

</section>

<footer>
© 2026 DARK CHARM BOT
<br><br>
Powered by DARK CHARM
</footer>

<script>
async function startPairing() {
  const phone = document.getElementById("phone").value.trim();
  const message = document.getElementById("message");
  const button = document.getElementById("startButton");

  if (!/^255[0-9]{9}$/.test(phone)) {
    message.textContent =
      "Enter a valid test number in format 255XXXXXXXXX.";
    return;
  }

  button.disabled = true;
  message.textContent = "Connecting to DARK CHARM server...";

  try {
    const response = await fetch(
      "https://dark-charm-bot-1.onrender.com/api/status",
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ phone })
      }
    );

    const data = await response.json();

    if (!response.ok) {
      throw new Error("Server error");
    }

    message.textContent = data.message ||
      "Backend connection successful!";
  } catch (error) {
    message.textContent =
      "Connection failed. Please try again.";
  } finally {
    button.disabled = false;
  }
}
</script>

</body>
</html>
